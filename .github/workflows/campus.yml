name: Campus Reconciliation

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC = 10:30 AM IST
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # A fresh run always creates a NEW cache entry (unique run id), and
      # restore-keys falls back to the most recently saved one with this
      # prefix - this is what lets each run pick up whatever cookie
      # rotation the PREVIOUS run's save step captured, instead of
      # replaying the same stale snapshot forever (see ads_account.py's
      # own note on why a reused-but-never-resaved session goes stale).
      - name: Restore session cache
        uses: actions/cache/restore@v4
        with:
          path: |
            storage_state_campus.json
            storage_state_hector.json
            hector_mcp_token.json
          key: campus-session-${{ github.run_id }}
          restore-keys: |
            campus-session-

      # storage_state_hector.json is deliberately NOT seeded from a secret -
      # Hector's login has no 2FA (plain email+password), so a fresh,
      # fully-automated login works fine even with zero cached session;
      # caching it above is purely a speed optimization, not a requirement.
      - name: Seed sessions from secrets on first-ever run
        run: |
          [ -f storage_state_campus.json ] || echo "${{ secrets.STORAGE_STATE_CAMPUS_B64 }}" | base64 -d > storage_state_campus.json
          [ -f hector_mcp_token.json ] || echo "${{ secrets.HECTOR_MCP_TOKEN_B64 }}" | base64 -d > hector_mcp_token.json

      - name: Write .env
        run: |
          cat > .env << EOF
          AMAZON_ADS_EMAIL=${{ secrets.AMAZON_ADS_EMAIL }}
          AMAZON_ADS_PASSWORD=${{ secrets.AMAZON_ADS_PASSWORD }}
          AMAZON_ADS_TOTP_SECRET=${{ secrets.AMAZON_ADS_TOTP_SECRET }}
          AMAZON_ADS_BASE_URL=${{ secrets.AMAZON_ADS_BASE_URL }}
          HEADLESS=true
          HECTOR_EMAIL=${{ secrets.HECTOR_EMAIL }}
          HECTOR_PASSWORD=${{ secrets.HECTOR_PASSWORD }}
          HECTOR_BASE_URL=${{ secrets.HECTOR_BASE_URL }}
          EOF

      - name: Write Google service account key
        run: echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}" | base64 -d > data-reconciliation-510312-70a744333ac6.json

      - name: Compute trailing 30-day window
        id: dates
        run: |
          echo "start=$(date -u -d '30 days ago' +%d-%m-%Y)" >> "$GITHUB_OUTPUT"
          echo "end=$(date -u -d 'yesterday' +%d-%m-%Y)" >> "$GITHUB_OUTPUT"

      - name: Run pipeline
        run: python run_pipeline.py --start ${{ steps.dates.outputs.start }} --end ${{ steps.dates.outputs.end }} --brand campus

      # Confirmed live: if: always() let a FAILED login's unchanged (still-
      # expired) session get cached, which then poisoned every later run's
      # restore-keys fallback - permanently shadowing a freshly-updated
      # seed secret until that cache entry expired naturally. Only cache
      # on success, so a bad session can never get "locked in".
      - name: Save session cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            storage_state_campus.json
            storage_state_hector.json
            hector_mcp_token.json
          key: campus-session-${{ github.run_id }}
